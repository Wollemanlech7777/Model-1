services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site_companion
    ports:
      - "5432:5432"
    volumes:
      - site_companion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site_companion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  site_companion_pg:
